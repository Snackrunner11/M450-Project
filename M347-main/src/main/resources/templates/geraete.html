<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geräte Übersicht</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; }
        .container { width: 90%; margin: 20px auto; padding: 20px; background-color: #fff; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .add-button { display: block; width: 200px; margin: 20px auto; padding: 10px; background-color: #28a745; color: #fff; text-align: center; text-decoration: none; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        .available { color: green; font-weight: bold; }
        .unavailable { color: red; font-weight: bold; }
        
        /* Alte Styles für die Action Buttons (Ausleihen/Zurückgeben) */
        .action-buttons { display: flex; gap: 10px; }
        .action-buttons input[type="text"] { flex: 1; padding: 5px; }
        .action-buttons button { padding: 5px 10px; background-color: #007bff; color: #fff; border: none; border-radius: 3px; cursor: pointer; }
        .return-btn-style { background-color: #dc3545 !important; color: white !important; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer;}
        
        /* Neue Styles für Bearbeiten und Löschen */
        .mgmt-buttons { display: flex; gap: 10px; }
        .edit-button { padding: 5px 10px; background-color: #ffc107; color: #000; text-decoration: none; border-radius: 3px; }
        .delete-button { padding: 5px 10px; background-color: #343a40; color: #fff; text-decoration: none; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Geräte Liste</h1>
        <a class="add-button" th:href="@{/geraete/add}"><i class="fas fa-plus"></i> Neues Gerät hinzufügen</a>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Produkt</th>
                    <th>Typ</th>
                    <th>Status</th>
                    <th>Ausleihe</th>
                    <th>Verwaltung</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="geraet : ${geraete}">
                    <td th:text="${geraet.id}"></td>
                    <td th:text="${geraet.produkt}"></td>
                    <td th:text="${geraet.typ}"></td>
                    <td>
                        <span th:if="${geraet.status}" class="available">✔ Verfügbar</span>
                        <span th:unless="${geraet.status}" class="unavailable">
                            ❌ Ausgeliehen von: <span th:text="${ausleiheMap[geraet.id]}"></span>
                        </span>
                    </td>
                    <td>
                        <div class="action-buttons">
                            <form th:if="${geraet.status}" th:action="@{/ausleihe/ausleihen/{id}(id=${geraet.id})}" method="post">
                                <input type="text" name="name" placeholder="Name eingeben" required>
                                <button type="submit"><i class="fas fa-hand-holding"></i> Ausleihen</button>
                            </form>
                            <form th:unless="${geraet.status}" th:action="@{/ausleihe/zurueckgeben/{id}(id=${geraet.id})}" method="post">
                                <button type="submit" class="return-btn-style"><i class="fas fa-undo"></i> Zurückgeben</button>
                            </form>
                        </div>
                    </td>
                    <td>
                        <div class="mgmt-buttons">
                            <a class="edit-button" th:href="@{/geraete/edit/{id}(id=${geraet.id})}"><i class="fas fa-edit"></i> Bearbeiten</a>
                            <a class="delete-button" th:href="@{/geraete/delete/{id}(id=${geraet.id})}" 
                               onclick="return confirm('Möchtest du dieses Gerät wirklich löschen?');"><i class="fas fa-trash"></i> Löschen</a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
